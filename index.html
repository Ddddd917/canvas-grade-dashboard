<style>
/* Layout: 暖奶油画布 + 暖墨色 + 唯一的珊瑚色强调。标题和大数字用衬线体，界面文字用无衬线体；五门课只用低饱和的灰调色相，出现在小色点、细边和时间线浅色条上，卡片本身保持奶油白 */
:root {
  /* 画布与卡片 */
  --bg: #F4F0E7; --bg-card: #FBFAF6; --bg-pop: #FFFEFB;
  --card-border: #E5DED1;
  --topbar-bg: rgba(244,240,231,.86); --topbar-line: #E5DED1;
  --sync-bg: #FBFAF6;
  --logo-bg: #1A1915; --logo-fg: #FBFAF6;
  /* 墨色 */
  --text-1: #1A1915; --text-2: #3D3C38; --text-3: #6C6A64; --text-4: #A8A399;
  --fill-1: #F6F2EA; --fill-2: #EFEAE0; --fill-3: #E5DED2; --fill-4: #C9C1B3;
  --border-1: #EDE7DC; --border-2: #E3DCCF; --border-3: #CBC2B3;
  --tag-strong: #E9E2D4;
  /* 珊瑚色：唯一的强调色 */
  --primary: #A9502F; --primary-hover: #8F4428; --primary-press: #8C4029;
  --primary-fill: #B5573A; --primary-fill-hover: #A64C30;
  --primary-light: #F6E8E1; --primary-light-2: #E5BDAC;
  --accent: #C96442;
  --btn-line: #D9D0C1;
  --on-fill: #FFFFFF; --on-status: #FFFFFF;
  /* 语义色：低饱和的泥土色调 */
  --success: #6E865F; --success-t: #476039; --success-light: #E8EDE1;
  --warning: #BA8B45; --warning-t: #765523; --warning-light: #F5ECDC;
  --danger: #A34E43; --danger-t: #7E352B; --danger-light: #F5E3DF; --danger-fill: #A34E43;
  /* 五门课：灰调色相，亮度接近 */
  --c-blue: #617B9E; --c-blue-l: #DCE1E4; --c-blue-t: #33455B;
  --c-purple: #906F95; --c-purple-l: #E6DEE3; --c-purple-t: #513A55;
  --c-cyan: #557C74; --c-cyan-l: #DAE1DC; --c-cyan-t: #375851;
  --c-gold: #947A4C; --c-gold-l: #E6E0D4; --c-gold-t: #614E2E;
  --c-magenta: #A97075; --c-magenta-l: #EBDEDC; --c-magenta-t: #5C3337;
  --on-cc: #FFFFFF;
  --now-mix: 34%; --now-t-mix: 100%;
  /* 倒计时卡 */
  --hero-bg: #EEE6D7; --hero-line: #E2D8C6;
  --hero-text: #1A1915; --hero-sub: #5E5B54;
  --hero-num: #C15F3C; --hero-fill: #C96442;
  --hero-track: rgba(26,25,21,.10); --hero-mark: rgba(26,25,21,.38);
  --hero-glow: rgba(214,128,96,.24); --hero-glow-2: rgba(255,253,247,.75);
  --plane: #C96442; --plane-op: .55;
  /* 时间线 */
  --g-band: rgba(26,25,21,.055);
  --flight-line: rgba(26,25,21,.50);
  --flag-ink: #2A2926; --flag-ink-t: #FBFAF6;
  --legend-now: #DCD4C6;
  --stripe: rgba(255,255,255,.55);
  --tip-bg: #2A2926; --tip-text: #F4F1EA; --tip-line: rgba(255,255,255,0);
  /* 阴影：极少使用，层次主要靠色块 */
  --shadow-1: 0 1px 2px rgba(60,45,20,.04);
  --shadow-2: 0 10px 24px -10px rgba(60,45,20,.18), 0 2px 5px rgba(60,45,20,.05);
  --shadow-3: 0 18px 40px -14px rgba(60,45,20,.26), 0 4px 10px -4px rgba(60,45,20,.08);
  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-io: cubic-bezier(.45, 0, .55, 1);
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-num: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-serif: "Cormorant Garamond", "EB Garamond", Garamond, Georgia, "Songti SC", "Noto Serif SC", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --r-xs: 4px; --r-s: 6px; --r-m: 8px; --r-l: 12px; --r-xl: 16px; --r-pill: 9999px;
  color-scheme: light;
}

    --danger: #C57C72; --danger-t: #DFABA4; --danger-light: #413531; --danger-fill: #A9493B;
    --c-blue: #92A3B9; --c-blue-l: #3F4246; --c-blue-t: #BFCAD9;
    --c-purple: #B19DB4; --c-purple-l: #464144; --c-purple-t: #D2C3D5;
    --c-cyan: #7CA29A; --c-cyan-l: #3A423F; --c-cyan-t: #C1D7D2;
    --c-gold: #B69F77; --c-gold-l: #474137; --c-gold-t: #DDD1BB;

    --now-mix: 40%; --now-t-mix: 30%;
    --hero-bg: #2C2A27; --hero-line: #3A3733;
    --hero-text: #F0EDE6; --hero-sub: #B3AEA3;
    --hero-num: #E08A6B; --hero-fill: #D97757;
    --hero-track: rgba(240,237,230,.11); --hero-mark: rgba(240,237,230,.42);
    --hero-glow: rgba(217,119,87,.13); --hero-glow-2: rgba(240,237,230,.025);
    --plane: #D97757; --plane-op: .45;
    --g-band: rgba(240,237,230,.05);
    --flight-line: rgba(240,237,230,.50);
    --flag-ink: #F0EDE6; --flag-ink-t: #1F1E1C;
    --legend-now: #57534D;
    --stripe: rgba(0,0,0,.22);
    --tip-bg: #3A3835; --tip-text: #F0EDE6; --tip-line: rgba(240,237,230,.08);
    --shadow-1: 0 1px 2px rgba(0,0,0,.22);
    --shadow-2: 0 12px 28px -10px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.25);
    --shadow-3: 0 20px 44px -14px rgba(0,0,0,.66), 0 6px 14px -6px rgba(0,0,0,.40);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-1); font-family: var(--font); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; transition: color .2s var(--ease); }
a:hover { color: var(--primary-hover); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* ---------- 顶栏 + Tabs ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--topbar-bg); -webkit-backdrop-filter: saturate(1.2) blur(14px); backdrop-filter: saturate(1.2) blur(14px); border-bottom: 1px solid var(--topbar-line); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px 8px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: var(--r-m); background: var(--logo-bg); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 18px; stroke: var(--logo-fg); }
.brand-title { font-family: var(--font-serif); font-size: 20px; font-weight: 500; letter-spacing: -0.005em; font-variant-numeric: lining-nums; line-height: 1.2; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.sync { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px; border-radius: var(--r-pill); background: var(--sync-bg); border: 1px solid var(--border-2); color: var(--text-2); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sync .dot { --pulse: var(--success); width: 7px; height: 7px; border-radius: 50%; background: var(--pulse); box-shadow: 0 0 0 0 var(--pulse); animation: pulse 2.4s var(--ease) infinite; flex: none; }
.sync.stale .dot { --pulse: var(--warning); }
.sync.busy .dot { --pulse: var(--primary); }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-m); border: 1px solid var(--btn-line); background: var(--bg-card); color: var(--text-1); font-size: 13.5px; font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease); }
.btn:hover { background: var(--fill-2); border-color: var(--border-3); color: var(--text-1); text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn svg { color: var(--text-3); }
.btn.btn-primary { height: 34px; padding: 0 16px; font-size: 14px; background: var(--primary-fill); border-color: var(--primary-fill); color: var(--on-fill); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--on-fill) 14%, transparent); }
.btn.btn-primary svg { color: inherit; }
.btn.btn-primary:hover { background: var(--primary-fill-hover); border-color: var(--primary-fill-hover); color: var(--on-fill); }
.btn.btn-primary:active { transform: scale(.97); background: var(--primary-press); border-color: var(--primary-press); }
.btn.btn-primary:disabled { opacity: .8; cursor: progress; }
.btn .ri { width: 14px; height: 14px; flex: none; }
.btn.busy .ri { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 提示条 */
#app.static *, #app.static *::before, #app.static *::after { animation: none !important; }
.toasts { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 112px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; max-width: 520px; padding: 13px 16px; border-radius: var(--r-l); background: var(--bg-pop); border: 1px solid var(--card-border); box-shadow: var(--shadow-3); color: var(--text-1); font-size: 14px; animation: toastIn .36s var(--ease); }
.toast.out { animation: toastOut .25s var(--ease) forwards; }
.toast .ti { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; color: var(--on-fill); font-size: 11px; font-weight: 700; font-style: normal; line-height: 1; }
.toast.success .ti { background: var(--success); color: var(--on-status); } .toast.info .ti { background: var(--primary-fill); }
.toast.warning .ti { background: var(--warning); color: var(--on-status); } .toast.error .ti { background: var(--danger-fill); }
.toast-t { font-weight: 600; }
.toast-d { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.toast ul { margin: 4px 0 0; padding-left: 16px; color: var(--text-2); font-size: 13px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px) scale(.98); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pulse, var(--success)) 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.tabs { position: relative; display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 12px 0 14px; border: 0; background: none; cursor: pointer; color: var(--text-2); font-size: 14px; font-weight: 500; white-space: nowrap; transition: color .2s var(--ease); }
.tab:hover { color: var(--text-1); }
.tab[aria-selected="true"] { color: var(--text-1); }
.tab .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--cc, var(--primary)); }
.tab .tcode { color: var(--text-3); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .tcode { color: var(--text-3); }
.ink { position: absolute; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); transition: left .35s var(--ease), width .35s var(--ease); pointer-events: none; }

/* ---------- 面板 ---------- */
main { padding-block: 28px 56px; }
.panel { display: none; }
.panel.active { display: block; animation: panelIn .5s var(--ease); }
@keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.stack { display: grid; gap: 22px; }
.card { background: var(--bg-card); border: 1px solid var(--card-border); border-radius: var(--r-l); padding: 26px; min-width: 0; box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 20px; flex-wrap: wrap; }
.card-t { font-family: var(--font-serif); font-size: 21px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; font-variant-numeric: lining-nums; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 12.5px; color: var(--text-3); font-weight: 400; line-height: 1.55; margin-top: 4px; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }

/* 标签：中性底色的胶囊，只有承载含义时才带颜色 */
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; line-height: 22px; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--fill-2); color: var(--text-2); }
.tag.blue { background: var(--tag-strong); color: var(--text-1); }
.tag.green { background: var(--success-light); color: var(--success-t); }
.tag.orange { background: var(--warning-light); color: var(--warning-t); }
.tag.red { background: var(--danger-light); color: var(--danger-t); }
.tag.dashed { background: transparent; border: 1px dashed var(--border-3); color: var(--text-3); line-height: 20px; }
.tag.course { background: var(--cc-l); color: var(--cc-t); }

/* ---------- 概览 ---------- */
.ov-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 22px; }
/* 倒计时卡：深一级的奶油色块，右上角一团柔和的暖光，珊瑚色线描飞机 */
.card.flight { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; border-radius: var(--r-xl); background: var(--hero-bg); border-color: var(--hero-line); color: var(--hero-text); box-shadow: none; padding: 28px 32px 26px; min-height: 296px; }
.card.flight::before { content: ""; position: absolute; z-index: -1; inset: 0; pointer-events: none;
  background:
    radial-gradient(58% 85% at 92% 0%, var(--hero-glow) 0%, transparent 72%),
    radial-gradient(70% 70% at 0% 100%, var(--hero-glow-2) 0%, transparent 72%); }
.card.flight .card-t { font-size: 23px; color: var(--hero-text); }
.card.flight .card-sub { color: var(--hero-sub); font-size: 13px; }
.flight-plane { position: absolute; z-index: -1; right: 26px; top: 22px; width: 156px; height: 156px; opacity: var(--plane-op); pointer-events: none; transform: rotate(40deg); animation: drift 11s var(--ease-io) infinite alternate; }
.flight-plane svg { display: block; width: 100%; height: 100%; fill: none; stroke: var(--plane); stroke-width: .28px; stroke-linejoin: round; }
@keyframes drift { from { transform: translate(0,0) rotate(38deg); } to { transform: translate(-10px, 8px) rotate(42deg); } }
.cd { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; margin-top: 20px; margin-bottom: 28px; position: relative; }
.cd-unit { display: flex; flex-direction: column; }
.cd-num { font-family: var(--font-serif); font-size: 62px; line-height: .92; font-weight: 500; letter-spacing: -0.015em; font-variant-numeric: lining-nums tabular-nums; color: var(--hero-text); }
.cd-unit.days .cd-num { font-size: 124px; letter-spacing: -0.035em; margin-left: -5px; padding-right: 6px; color: var(--hero-num); }
.cd-lab { font-size: 12px; font-weight: 500; color: var(--hero-sub); margin-top: 10px; letter-spacing: .12em; }
.track { position: relative; height: 4px; border-radius: var(--r-pill); background: var(--hero-track); margin-top: auto; }
.track-fill { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-pill); background: var(--hero-fill); animation: trackIn 1.4s var(--ease) both; }
.track-fill::after { content: ""; position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--hero-bg); border: 2px solid var(--hero-fill); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hero-fill) 16%, transparent); box-sizing: border-box; }
.track-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--hero-sub); font-variant-numeric: tabular-nums; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
.track-mark { position: absolute; top: -5px; width: 2px; height: 14px; background: var(--hero-mark); border-radius: 1px; }
@keyframes trackIn { from { width: 0; } }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.ov-kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.kpi { background: var(--fill-1); border: 1px solid var(--border-1); border-radius: var(--r-m); padding: 16px 18px 15px; transition: border-color .2s var(--ease); }
.kpi:hover { border-color: var(--border-3); }
.kpi-l { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.kpi-v { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1.02; letter-spacing: -0.02em; margin-top: 8px; font-variant-numeric: lining-nums tabular-nums; color: var(--text-1); }
.kpi-v small { font-size: 13px; color: var(--text-3); font-weight: 400; margin-left: 5px; letter-spacing: 0; font-family: var(--font); }
.kpi-d { font-size: 12px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

.ccards { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 16px; }
.ccard { position: relative; overflow: hidden; text-align: left; cursor: pointer; padding: 22px 20px 18px; background: var(--bg-card); transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease); animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
.ccard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--cc); opacity: .8; }
.ccard:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--border-3); }
.ccard:active { transform: translateY(-1px); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ccard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ccode { font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.ccode i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); display: inline-block; }
.cname { font-size: 14px; font-weight: 500; color: var(--text-1); margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbig { display: flex; align-items: baseline; gap: 3px; margin-top: 10px; }
.cbig .num { font-family: var(--font-serif); font-size: 52px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; color: var(--text-1); }
.cbig .pct { font-family: var(--font-serif); font-size: 22px; color: var(--text-3); }
.cbig + .small { margin-top: 4px; }
.cgrade { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cnext { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-1); font-size: 12px; color: var(--text-2); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.cnext span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* 100 分去向条 */
.sbar { display: flex; height: 8px; border-radius: var(--r-pill); overflow: hidden; background: var(--fill-3); animation: reveal 1.1s var(--ease) both; }
.sbar.thin { height: 5px; margin-top: 14px; }
.seg { height: 100%; transition: width .5s var(--ease); }
.seg + .seg { box-shadow: inset 2px 0 0 var(--bg-card); }
.seg.earned { background: var(--success); }
.seg.lost { background: var(--danger); }
.seg.pending { background: var(--primary-light-2); background-image: repeating-linear-gradient(-45deg, transparent 0 4px, var(--stripe) 4px 7px); background-size: 20px 20px; animation: stripes 1.2s linear infinite; }
.seg.remain { background: transparent; }
@keyframes stripes { to { background-position: 20px 0; } }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.legend .earned i { background: var(--success); } .legend .lost i { background: var(--danger); }
.legend .pending i { background: var(--primary-light-2); } .legend .remain i { background: var(--fill-3); }

/* ---------- 甘特图 ---------- */
.gscroll { overflow-x: auto; margin: 0 -26px; padding: 0 26px 8px; scrollbar-width: thin; scrollbar-color: var(--fill-4) transparent; }
.gantt { min-width: 900px; position: relative; isolation: isolate; font-size: 12px; }
.g-row { display: flex; }
.g-lab { width: 136px; flex: none; padding-right: 12px; }
.g-tl { position: relative; flex: 1; min-width: 0; }
.g-head .g-tl { height: 62px; border-bottom: 1px solid var(--border-2); }
.g-month { position: absolute; top: 0; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); padding-left: 7px; border-left: 1px solid var(--border-3); height: 16px; line-height: 16px; }
.g-week { position: absolute; top: 20px; color: var(--text-3); font-size: 11px; line-height: 16px; transform: translateX(-50%); font-family: var(--font-num); font-variant-numeric: tabular-nums; padding: 0 5px; border-radius: var(--r-pill); }
.g-week.now { color: var(--primary); background: var(--primary-light); font-weight: 600; }
.g-course { border-bottom: 1px solid var(--border-1); transition: background-color .2s var(--ease); }
.g-course:last-child { border-bottom: 0; }
.g-course:hover { background: var(--fill-1); }
.g-course .g-lab { padding-block: 10px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.g-cname { font-weight: 600; font-size: 13px; color: var(--text-1); display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.g-cname i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); flex: none; }
.g-lanes { display: flex; flex-direction: column; }
.g-lane { position: relative; display: flex; }
.g-lane-lab { position: absolute; left: -64px; width: 56px; text-align: right; color: var(--text-3); font-size: 11px; top: 50%; transform: translateY(-50%); }
.g-lanes-wrap { position: relative; flex: 1; padding-block: 8px; }
.g-bar { position: absolute; height: 22px; border-radius: 5px; padding: 0 8px 0 10px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 12px; font-weight: 500; cursor: default; z-index: 1;
  background: var(--cc-l); color: var(--cc-t); border: 1px solid color-mix(in srgb, var(--cc) 24%, transparent); box-shadow: inset 2px 0 0 var(--cc);
  transform-origin: left center; animation: barIn .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 22ms);
  transition: box-shadow .2s var(--ease), transform .2s var(--ease), background-color .2s var(--ease), color .2s var(--ease); }
.g-bar span { overflow: hidden; text-overflow: ellipsis; }
.g-bar.now { background: color-mix(in srgb, var(--cc) var(--now-mix), var(--bg-card)); color: color-mix(in srgb, var(--cc-t) var(--now-t-mix), var(--text-1)); border-color: color-mix(in srgb, var(--cc) 72%, var(--bg-card)); font-weight: 600; box-shadow: inset 3px 0 0 var(--cc), 0 1px 3px color-mix(in srgb, var(--cc) 22%, transparent); }
.g-bar.past { background: var(--bg-card); color: var(--text-3); border-color: var(--border-2); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--cc) 34%, var(--fill-3)); }
.g-bar.guess { border-style: dashed; }
.g-bar:hover { box-shadow: inset 2px 0 0 var(--cc), var(--shadow-2); z-index: 3; }
.g-bar.now:hover { box-shadow: inset 3px 0 0 var(--cc), var(--shadow-2); }
.g-bar.past:hover { color: var(--text-2); }
.g-ms { position: absolute; z-index: 1; width: 14px; height: 14px; transform: translate(-50%, 0) rotate(45deg); border-radius: 3px; background: var(--cc); border: 2.5px solid var(--bg-card); box-shadow: 0 0 0 1px var(--cc); animation: msIn .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 22ms + 200ms); cursor: default; }
.g-ms.past { background: var(--fill-4); box-shadow: 0 0 0 1px var(--fill-4); }
.g-ms.guess { background: var(--bg-card); box-shadow: 0 0 0 1px var(--cc); border: 2px dashed var(--cc); }
.g-ms-lab { position: absolute; font-size: 11px; font-weight: 500; color: var(--text-2); white-space: nowrap; transform: translateY(1px); pointer-events: none; }
@keyframes barIn { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
@keyframes msIn { from { transform: translate(-50%, 0) rotate(45deg) scale(0); } to { transform: translate(-50%, 0) rotate(45deg) scale(1); } }
.g-overlay { position: absolute; top: 0; bottom: 0; left: 136px; right: 0; pointer-events: none; }
/* 周网格画在泳道底下（不再盖在色条文字上）：17 周 = 整条时间轴，每周一条细线 */
.g-grid { position: absolute; top: 62px; bottom: 0; width: 1px; background: transparent; }
.g-course .g-tl { background-image: repeating-linear-gradient(to right, transparent 0 calc(100% / 17 - 1px), var(--border-1) calc(100% / 17 - 1px) calc(100% / 17)); }
.g-band { position: absolute; top: 62px; bottom: 0; background: repeating-linear-gradient(-45deg, var(--g-band) 0 6px, transparent 6px 12px); border-left: 1px solid var(--g-band); border-right: 1px solid var(--g-band); }
.g-band.off { background: var(--g-band); border-color: transparent; }
.g-band-lab { position: absolute; top: 2px; font-size: 11px; color: var(--text-3); white-space: nowrap; }
.g-line { position: absolute; z-index: 2; top: 42px; bottom: 0; width: 2px; margin-left: -1px; overflow: visible; }
.g-line.today { background: linear-gradient(to bottom, var(--accent) 0%, var(--accent) 70%, color-mix(in srgb, var(--accent) 20%, transparent) 100%); }
.g-line.flight { width: 1.5px; margin-left: -0.75px; background: repeating-linear-gradient(to bottom, var(--flight-line) 0 5px, transparent 5px 9px); }
.g-flag { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; padding: 0 8px; height: 18px; line-height: 18px; border-radius: var(--r-pill); color: var(--on-fill); white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.g-line.today .g-flag { background: var(--primary-fill); }
.g-line.flight .g-flag { background: var(--flag-ink); color: var(--flag-ink-t); }
.g-line.today::after { --pulse: var(--accent); content: ""; position: absolute; top: 15px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--primary-light); animation: pulse 2.4s var(--ease) infinite; }
.g-legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--text-3); font-size: 12px; align-items: center; }
.g-legend .lb { display: inline-block; width: 18px; height: 10px; border-radius: 3px; background: var(--fill-2); border: 1px solid var(--border-3); box-shadow: inset 2px 0 0 var(--text-4); vertical-align: -1px; margin-right: 6px; }
.g-legend .lb.now { background: var(--legend-now); border-color: var(--text-3); box-shadow: inset 2px 0 0 var(--text-2); }
.g-legend .lb.guess { border-style: dashed; }
.g-legend .lb.off { background: var(--g-band); border-color: transparent; box-shadow: none; }
.g-legend .ld { display: inline-block; width: 9px; height: 9px; transform: rotate(45deg); background: var(--text-2); margin-right: 8px; border-radius: 2px; }

/* ---------- 待办 ---------- */
.todo-group + .todo-group { margin-top: 22px; }
.todo-gh { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--text-3); margin-bottom: 4px; padding: 0 8px 8px; border-bottom: 1px solid var(--border-1); font-variant-numeric: tabular-nums; }
.todo-gh b { font-family: var(--font-serif); color: var(--text-1); font-weight: 600; font-size: 17px; font-variant-numeric: lining-nums tabular-nums; letter-spacing: 0; }
.todo { display: flex; align-items: flex-start; gap: 12px; padding: 11px 8px; border-radius: var(--r-m); transition: background-color .2s var(--ease); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.todo:hover { background: var(--fill-1); }
.todo-main { flex: 1; min-width: 0; }
.todo-t { font-size: 14px; color: var(--text-1); transition: color .3s var(--ease); overflow-wrap: anywhere; }
.todo-s { font-size: 12px; color: var(--text-3); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.todo.done .todo-t { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-4); }
.todo-r { display: flex; align-items: center; gap: 8px; flex: none; padding-top: 1px; }
.chk { appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 2px 0 0; border: 1.5px solid var(--border-3); border-radius: 5px; background: var(--bg-card); cursor: pointer; position: relative; transition: background-color .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease); }
.chk:hover { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.chk:checked { background: var(--primary-fill); border-color: var(--primary-fill); }
.chk::after { content: ""; position: absolute; left: 5px; top: 1.5px; width: 4px; height: 9px; border: solid var(--on-fill); border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); transition: transform .25s var(--ease); }
.chk:checked::after { transform: rotate(45deg) scale(1); }
.chk:disabled { cursor: not-allowed; }
.chk:disabled:hover { box-shadow: none; }
.chk:disabled:checked { background: var(--success); border-color: var(--success); }
.chk:disabled:checked::after { border-color: var(--on-status); }
.linkbtn { border: 0; background: none; color: var(--primary); cursor: pointer; padding: 4px 0; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.linkbtn:hover { color: var(--primary-hover); }
.linkbtn svg { transition: transform .3s var(--ease); }
.linkbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.empty { text-align: center; padding: 28px 12px; color: var(--text-3); }

/* ---------- 课程页 ---------- */
.ctitle { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 24px; }
.ctitle h2 { margin: 0; font-family: var(--font-serif); font-size: 40px; font-weight: 500; line-height: 1.1; letter-spacing: -0.015em; font-variant-numeric: lining-nums; color: var(--text-1); text-wrap: balance; display: flex; align-items: center; gap: 14px; }
.ctitle h2 i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); box-shadow: 0 0 0 4px var(--cc-l); }
.ctitle .sub { color: var(--text-3); font-size: 13px; margin-top: 8px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: center; }
.ring { position: relative; width: 156px; height: 156px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { stroke-width: 9px; }
.ring .bgc { stroke: var(--fill-3); }
.ring .fgc { stroke: var(--rc, var(--primary)); stroke-linecap: round; animation: ringIn 1.4s var(--ease) both; }
@keyframes ringIn { from { stroke-dashoffset: 427.26; } }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-c .num { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; color: var(--text-1); }
.ring-c .num small { font-size: 18px; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }
.ring-c .lab { font-size: 11.5px; color: var(--text-3); margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.stat { background: var(--fill-1); border: 1px solid var(--border-1); border-radius: var(--r-m); padding: 13px 15px; }
.stat-l { font-size: 12px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.stat-l i { width: 7px; height: 7px; border-radius: 50%; }
.stat-v { font-family: var(--font-serif); font-size: 34px; font-weight: 500; line-height: 1.1; letter-spacing: -0.015em; margin-top: 4px; font-variant-numeric: lining-nums tabular-nums; color: var(--text-1); }
.stat-v small { font-size: 12px; color: var(--text-3); font-weight: 400; letter-spacing: 0; font-family: var(--font); margin-left: 5px; }
.hero-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }

.grow { display: grid; grid-template-columns: 168px minmax(0, 1fr) 96px; gap: 16px; align-items: center; padding: 13px 0; }
.grow + .grow { border-top: 1px solid var(--border-1); }
.grow-l { min-width: 0; }
.grow-n { font-size: 13.5px; font-weight: 500; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow-w { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.grow-r { text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.grow-r .num { font-family: var(--font-serif); font-size: 21px; color: var(--text-1); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.gbar { height: 8px; border-radius: var(--r-pill); background: var(--fill-3); display: flex; overflow: hidden; animation: reveal 1.1s var(--ease) both; animation-delay: calc(var(--i, 0) * 80ms + 150ms); }
.gbar.unknown { background: var(--fill-2); background-image: repeating-linear-gradient(-45deg, transparent 0 4px, var(--fill-3) 4px 8px); }

.targets { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.tchip { border: 1px solid var(--border-2); border-radius: var(--r-m); padding: 12px 14px; background: var(--bg-card); transition: border-color .2s var(--ease), background-color .2s var(--ease); }
.tchip:hover { border-color: var(--border-3); background: var(--fill-1); }
.tchip-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--text-3); gap: 0 6px; font-variant-numeric: tabular-nums; }
.tchip-h b { color: var(--text-1); font-weight: 600; font-size: 13px; white-space: nowrap; }
.tchip-h span { white-space: nowrap; }
.tchip-v { font-family: var(--font-serif); font-size: 30px; font-weight: 500; letter-spacing: -0.01em; margin-top: 4px; line-height: 1.15; font-variant-numeric: lining-nums tabular-nums; }
.tchip-v.ok { color: var(--success-t); } .tchip-v.mid { color: var(--primary); } .tchip-v.hard { color: var(--warning-t); } .tchip-v.no { color: var(--text-3); }
.tchip-d { font-size: 12px; color: var(--text-3); text-wrap: pretty; }
.sim { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-1); }
.sim-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text-2); }
.sim-out { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.sim-out .num { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; color: var(--text-1); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: var(--r-pill); background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--fill-3) var(--p, 50%)); margin: 16px 0 6px; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-card); border: 2px solid var(--accent); box-shadow: var(--shadow-1); transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.12); box-shadow: 0 0 0 6px var(--primary-light); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--bg-card); border: 2px solid var(--accent); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-3); border-radius: var(--r-m); overflow: hidden; background: var(--bg-card); }

<script>
(function () {
'use strict';
const C = window.DASH_CONFIG;
let S = window.CANVAS_SNAPSHOT || { fetchedAt: null, courses: {} };
const TZ = C.tz;
let NOW = new Date();
let cdTimer = null;
let remoteSeen = false, refreshing = false;
let SIM = {}; // 目标计算滑块的位置（按课程）
try { SIM = JSON.parse(localStorage.getItem('uf-dash-sim') || '{}') || {}; } catch (e) {}
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 小工具 ---------- */
function el(tag, props) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'svg') n.innerHTML = v; // 仅用于页面自带的静态图标
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) add(n, arguments[i]);
  return n;
}
function add(n, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(x => add(n, x)); return; }
  n.append(c instanceof Node ? c : document.createTextNode(String(c)));
}
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const fx = (v, d = 1) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d).replace(/\.0+$/, d ? '.0' : '');
const f1 = v => (v == null || isNaN(v)) ? '—' : (Math.round(v * 10) / 10).toFixed(1);
const ccVars = c => `--cc:var(--c-${c});--cc-l:var(--c-${c}-l);--cc-t:var(--c-${c}-t)`;
const ICON_CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const ICON_EXT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

/* ---------- 时间（美东） ---------- */
const fmtKey = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtMD = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'numeric', day: 'numeric' });
const fmtWD = new Intl.DateTimeFormat('zh-CN', { timeZone: TZ, weekday: 'short' });
const fmtHM = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const etOffset = key => (key >= '2026-03-08' && key < '2026-11-01') ? '-04:00' : '-05:00';
function parseDue(s) {
  if (!s) return null;
  if (/Z$|[+-]\d\d:\d\d$/.test(s)) return { date: new Date(s), allDay: false };
  if (/^\d{4}-\d\d-\d\d$/.test(s)) return { date: new Date(s + 'T23:59:00' + etOffset(s)), allDay: true };
  return { date: new Date(s + ':00' + etOffset(s.slice(0, 10))), allDay: false };
}
const keyOf = d => fmtKey.format(d);
const dayNum = key => Date.UTC(+key.slice(0, 4), +key.slice(5, 7) - 1, +key.slice(8, 10)) / 864e5;
let TODAY = keyOf(NOW);
function fmtDue(d) {
  if (!d) return '日期待定';
  const md = fmtMD.format(d.date), wd = fmtWD.format(d.date);
  return d.allDay ? `${md} ${wd}` : `${md} ${wd} ${fmtHM.format(d.date)}`;
}
function countdown(d) {
  if (!d) return { text: '待定', tone: '' };
  const days = dayNum(keyOf(d.date)) - dayNum(TODAY);
  const ms = d.date - NOW;
  if (ms < 0 && !(d.allDay && days === 0)) return { text: '已过', tone: '' };
  if (!d.allDay && ms < 36e5) return { text: `还剩 ${Math.max(1, Math.round(ms / 6e4))} 分钟`, tone: 'red' };
  if (!d.allDay && ms < 864e5) return { text: `还剩 ${Math.floor(ms / 36e5)} 小时`, tone: 'red' };
  if (days === 0) return { text: '今天', tone: 'red' };
  if (days === 1) return { text: '明天', tone: 'red' };
  return { text: `${days} 天后`, tone: days <= 3 ? 'orange' : days <= 7 ? 'blue' : '' };
}

/* ---------- 成绩模型 ---------- */
// 课程可以有自己的等级线（cc.scale），没写就用全局的 C.scale
const letterOf = (v, cc) => { for (const [t, l] of ((cc && cc.scale) || C.scale)) if (v >= t) return l; return 'E'; };
const glasgowOf = l => C.glasgow[l] || '—';
const fromRow = r => ({ id: r[0], name: r[1], pts: r[2], due: r[3], score: r[4], state: r[5], sub: r[6], flags: r[7] ? r[7].split(',') : [] });
function statusOf(a) {
  if (a.flags.includes('excused')) return 'excused';
  if (a.state === 'graded' && a.score != null) return 'graded';
  if (a.state === 'submitted' || a.state === 'pending_review' || a.state === 'graded' || a.sub) return 'pending';
  const d = parseDue(a.due);
  if (!d) return 'ongoing';
  if (d.date < NOW) return a.flags.includes('missing') ? 'missing' : 'overdue';
  return 'todo';
}
function guessKind(name) {
  if (/\bexam\b|mid-?term/i.test(name)) return '考试'; // 「Examination」这类词不算考试
  if (/quiz|learning check/i.test(name)) return 'Quiz';
  if (/project|milestone|proposal|implementation|turtle|video|paper|report/i.test(name)) return '项目';
  if (/attendance/i.test(name)) return '出勤';
  return '作业';
}
const STATUS = {
  graded: ['已出分', 'green'], pending: ['已提交 · 待出分', 'blue'], todo: ['待完成', 'orange'],
  overdue: ['已过期', 'red'], missing: ['缺交', 'red'], ongoing: ['进行中', ''], done: ['已完成', 'green'],
  skip: ['不计', ''], excused: ['免交', ''], past: ['已过 · 待出分', 'blue']
};

function buildCourse(cc) {
  const snap = S.courses[cc.code] || null;
  const ov = cc.overrides || {};
  const base = `https://ufl.instructure.com/courses/${cc.canvasId}`;
  const all = snap ? snap.groups.flatMap(g => g.items.map(fromRow)) : [];
  const mkCanvas = a => {
    const o = ov[a.name] || {};
    // Canvas 隐藏了分数（score 为空）时，用配置里手填的成绩；Canvas 一旦放出分数就以 Canvas 为准
    const man = a.score == null && o.score != null;
    // 手动标「已完成」（组员代交、外部问卷这类 Canvas 不会有提交记录的）；Canvas 一旦有了提交或成绩就以 Canvas 为准
    const st = man ? 'graded' : statusOf(a);
    return { key: 'c:' + a.id, source: 'canvas', title: o.title || a.name, rawName: a.name,
      pts: man && o.pts != null ? o.pts : a.pts, score: man ? o.score : a.score, manualScore: man,
      status: o.status === 'done' && (st === 'graded' || st === 'pending') ? st : (o.status || st), due: parseDue(a.due), note: o.note || '', late: a.flags.includes('late'),
      link: `${base}/assignments/${a.id}`, kind: guessKind(a.name), course: cc };
  };
  const mkManual = (it, source) => {
    const due = parseDue(it.due);
    return { key: `m:${cc.code}:${it.title}`, source, title: it.title, pts: it.pts != null ? it.pts : null, score: null,
      status: it.status || (due && due.date < NOW && keyOf(due.date) !== TODAY ? 'past' : 'todo'), due, note: it.note || '',
      kind: it.kind || guessKind(it.title), course: cc, plan: !!it.plan, tentative: !!it.tentative };
  };
  const used = new Set(); // 已经归到某一项的 Canvas 条目
  const groups = cc.groups.map(g => {
    let items;
    if (g.canvas) {
      const sg = snap && snap.groups.find(x => x.name === g.canvas);
      const rows = sg ? sg.items.map(fromRow) : [];
      rows.forEach(a => used.add(a.id));
      items = rows.filter(a => !a.flags.includes('omit')).map(mkCanvas);
      for (const p of (g.placeholders || [])) {
        if (!items.some(i => i.rawName && i.rawName.includes(p.match))) items.push(mkManual(p, 'placeholder'));
      }
      const tot = sum(items, i => i.pts || 0);
      const counted = items.filter(i => (i.pts || 0) > 0).length;
      for (const i of items) {
        if (g.split === 'unknown' || !tot) { i.w = null; i.e = null; continue; }
        if (g.split === 'equal') {
          // 每项权重相同（例如三次考试各 15%），不按 Canvas 分值
          i.w = (i.pts || 0) > 0 ? g.weight / counted : 0;
          i.e = i.status === 'graded' && i.pts ? i.w * (i.score || 0) / i.pts : null;
          continue;
        }
        i.w = g.weight * (i.pts || 0) / tot;
        i.e = i.status === 'graded' ? g.weight * (i.score || 0) / tot : null;
      }
    } else {
      items = g.items.map(it => {
        const a = it.match ? all.find(x => !used.has(x.id) && new RegExp(it.match, 'i').test(x.name)) : null;
        if (a) used.add(a.id);
        const i = a ? mkCanvas(a) : mkManual(it, 'manual');
        if (it.title) i.title = it.title;
        if (it.note) i.note = it.note;
        if (it.kind) i.kind = it.kind;
        if (a && !a.due && it.due) i.due = parseDue(it.due);
        if (a && it.fixDue) i.due = parseDue(it.fixDue); // Canvas 上日期填错时用大纲/课上说的日期
        i.w = it.weight;
        i.e = (i.status === 'graded' && i.pts) ? it.weight * i.score / i.pts : null;
        return i;
      });
    }
    const wOf = st => sum(items.filter(i => i.w != null && st.includes(i.status)), i => i.w);
    const graded = wOf(['graded']);
    const pending = wOf(['pending', 'past']);
    return Object.assign({}, g, { items, graded, pending, earned: sum(items, i => i.e || 0),
      remaining: Math.max(0, g.weight - graded - pending), unknown: g.split === 'unknown' });
  });
  const T = { w: sum(groups, g => g.weight), graded: sum(groups, g => g.graded), pending: sum(groups, g => g.pending), earned: sum(groups, g => g.earned) };
  T.remaining = Math.max(0, T.w - T.graded - T.pending);
  T.lost = Math.max(0, T.graded - T.earned);
  const modelCur = T.graded > 0 ? T.earned / T.graded * 100 : null;
  const canvasCur = snap ? snap.current : null;
  // 按类别比例推算：每个已有成绩的类别先算得分率，再按类别权重加权（和期末的类别比例一致）
  const gradedGroups = groups.filter(g => !g.unknown && g.graded > 0.001);
  const catW = sum(gradedGroups, g => g.weight);
  const catCur = catW > 0 ? sum(gradedGroups, g => g.weight * g.earned / g.graded) / catW * 100 : null;
  const headline = cc.headline === 'canvas' && canvasCur != null ? canvasCur
    : cc.headline === 'model' ? modelCur
    : (catCur != null ? catCur : modelCur);
  const bonus = (cc.bonus || []).map(b => {
    if (b.canvasMatch) {
      const a = all.find(x => x.name.includes(b.canvasMatch));
      if (a) used.add(a.id);
      return Object.assign({}, b, { earned: a && a.score != null && a.pts ? b.max * a.score / a.pts : 0, detail: a ? `${a.score}/${a.pts}` : '' });
    }
    return Object.assign({}, b);
  });
  // Canvas 上新出现、配置里还没对应到大纲权重的条目：照常显示成绩和截止时间，但不计入总评
  const leftovers = all.filter(a => !used.has(a.id) && !a.flags.includes('omit'));
  if (leftovers.length) groups.push({
    label: '其他 Canvas 条目', weight: 0, extra: true, unknown: true, graded: 0, pending: 0, earned: 0, remaining: 0,
    note: 'Canvas 上新出现、还没对应到大纲权重的条目：成绩和截止时间照常显示，但暂不计入总评，等确认它算哪一部分后再归类。',
    items: leftovers.map(a => Object.assign(mkCanvas(a), { w: null, e: null }))
  });
  const extras = (cc.extras || []).map(e => mkManual(e, 'manual'));
  const items = groups.flatMap(g => g.items.map(i => Object.assign(i, { group: g }))).concat(extras);
  return { cc, snap, groups, T, modelCur, canvasCur, headline, bonus, extras, items };
}

/* ---------- 个人状态：勾选与出勤天数 ---------- */
const Store = {
  done: {}, copDays: null, ref: null, saving: false, dirty: false, listeners: [],
  loadLocal() { try { const s = JSON.parse(localStorage.getItem('uf-dash-state') || '{}'); this.done = s.done || {}; this.copDays = s.copDays != null ? s.copDays : null; } catch (e) {} },
  saveLocal() { try { localStorage.setItem('uf-dash-state', JSON.stringify({ done: this.done, copDays: this.copDays })); } catch (e) {} },
  snapRef: null,
  async connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      const db = await window.claude.use('db');
      if (!db) return;
      // 共享的最新快照：定时任务或桌面端刷新写入，所有设备打开时读取
      try {
        this.snapRef = db.doc('snapshots/latest');
        this.subscribeSnap(0);
        // 运行日志：定时任务每次运行写一条
        db.collection('runs').orderBy('at', 'desc').limit(200).onSnapshot(qs => {
          RUNS = qs.docs.map(d => d.data()).filter(r => r && typeof r.at === 'string');
          renderOpsLive();
        }, () => {});
      } catch (e) { this.snapRef = null; }
      const user = await window.claude.use('user');
      if (!user) return;
      const uid = await user.id();
      if (!uid) return;
      this.ref = db.doc(`data/users/${uid}/state`);
      this.ref.onSnapshot(snap => {
        if (!snap.exists) return;
        const d = snap.data() || {};
        this.done = Object.assign({}, d.done || {});
        this.copDays = d.copDays != null ? d.copDays : this.copDays;
        this.saveLocal();
        this.listeners.forEach(f => f());
      }, () => {});
    } catch (e) {}
  },
  subscribeSnap(attempt) {
    this.snapRef.onSnapshot(snap => {
      const first = !remoteSeen;
      remoteSeen = true;
      if (!snap.exists) return;
      let parsed = null;
      try { parsed = JSON.parse((snap.data() || {}).json); } catch (e) { return; }
      onRemoteSnapshot(parsed, first);
    }, err => {
      // 只有平台桥断开（unavailable）才值得重新订阅一次
      if (err && err.code === 'unavailable' && attempt < 1) setTimeout(() => this.subscribeSnap(attempt + 1), 1500 + Math.random() * 2000);
    });
  },
  async save() {
    this.saveLocal();
    if (!this.ref) return;
    if (this.saving) { this.dirty = true; return; }
    this.saving = true;
    try { await this.ref.set({ done: this.done, copDays: this.copDays, updatedAt: new Date().toISOString() }); } catch (e) {}
    this.saving = false;
    if (this.dirty) { this.dirty = false; this.save(); }
  },
  toggle(key, v) { if (v) this.done[key] = true; else delete this.done[key]; this.save(); }
};

/* ---------- Tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(e, title, lines) {
  tip.replaceChildren(el('b', { text: title }), ...lines.map(l => el('div', { class: 'd', text: l })));
  tip.classList.add('show');

function moveTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 12, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => tip.classList.remove('show');
function tipOn(node, title, lines) {
  node.addEventListener('mouseenter', e => showTip(e, title, lines));

  node.addEventListener('mouseleave', hideTip);
  node.addEventListener('focus', () => { const r = node.getBoundingClientRect(); showTip({ clientX: r.left, clientY: r.bottom }, title, lines); });
  node.addEventListener('blur', hideTip);

/* ---------- 数字滚动 ---------- */
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(n => {
    const target = parseFloat(n.dataset.count), dec = +(n.dataset.dec || 0);
    if (isNaN(target)) return;
    if (REDUCED) { n.textContent = target.toFixed(dec); return; }
    const t0 = performance.now(), dur = 900;
    const step = t => {
      const p = Math.min(1, (t - t0) / dur), v = target * (1 - Math.pow(1 - p, 3));
      n.textContent = v.toFixed(dec);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function renderOverviewTodos(card) {
  card.replaceChildren();
  const limit = parseDue(C.flightHome).date;
  const items = COURSES.flatMap(c => c.items).filter(i => isOpen(i) && isActionable(i) && (!i.due || i.due.date <= limit));
  const doneN = items.filter(i => Store.done[i.key]).length;
  card.append(el('div', { class: 'card-h' },
    el('div', null, el('div', { class: 'card-t' }, '回国前的全部任务'), el('div', { class: 'card-sub', text: '在 Canvas 上提交过的会自动勾掉；手动勾选会保存到你的账号' })),
    tag(`已完成 ${doneN} / ${items.length}`, 'blue')));
  // 按周分组（周一为一周开始）
  const monday = key => { const n = dayNum(key); const dow = (new Date(n * 864e5).getUTCDay() + 6) % 7; return n - dow; };
  const thisW = monday(TODAY);
  const buckets = new Map();
  const put = (k, label, i) => { if (!buckets.has(k)) buckets.set(k, { label, items: [] }); buckets.get(k).items.push(i); };
  items.sort((a, b) => (a.due ? a.due.date : Infinity) - (b.due ? b.due.date : Infinity)).forEach(i => {
    if (!i.due) return put(1e9, '日期待定', i);
    const k = keyOf(i.due.date), w = monday(k);
    if (i.status !== 'todo' && i.due.date < NOW) return put(-1, '已过期未交', i);
    const label = w === thisW ? '本周' : w === thisW + 7 ? '下周' : (() => { const d = new Date(w * 864e5); const e = new Date((w + 6) * 864e5); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} – ${e.getUTCMonth() + 1}/${e.getUTCDate()}`; })();
    put(w, label, i);
  });
  if (!items.length) { card.append(el('div', { class: 'empty', text: '回国前的任务都完成了' })); return; }
  let idx = 0;
  [...buckets.entries()].sort((a, b) => a[0] - b[0]).forEach(([, b]) => {
    card.append(el('div', { class: 'todo-group' },

/* ---------- 时间线缩放与拖动 ---------- */
const G_LAB = 136, G_DAY0 = '2026-08-17', G_DAYS = 119, G_MAX = 6;
const G_STEPS = [1, 1.5, 2, 3, 4, 6];
let gZoom = 1;

const zoomLabel = z => z <= 1.01 ? '整学期' : `约 ${Math.max(2, Math.round(17 / z))} 周`;
function gEls() {
  const sc = document.querySelector('#p-overview .gscroll');
  const g = sc && sc.querySelector('.gantt');

  document.querySelectorAll('.g-zoom [data-z="out"]').forEach(b => { b.disabled = gZoom <= 1.01; });

}
const todayFrac = () => (dayNum(TODAY) - dayNum(G_DAY0) + 0.5) / G_DAYS;
// 以 anchorX（屏幕坐标）下的日期为中心缩放；不给就以今天（在视野里时）或视野中间为中心
function setGanttZoom(z, anchorX) {

  const { sc, g, pad } = e;
  z = Math.min(G_MAX, Math.max(1, z));

  let ax = anchorX != null ? anchorX - rect.left : null;
  if (ax == null) {
    const tx = pad + G_LAB + todayFrac() * oldTrack - sc.scrollLeft;
    ax = (tx > G_LAB && tx < sc.clientWidth) ? tx : (G_LAB + sc.clientWidth) / 2;
  }
  const frac = Math.min(1, Math.max(0, (sc.scrollLeft + ax - pad - G_LAB) / oldTrack));

function fitGantt(restoreLeft) {

  if (!force && S.fetchedAt && Date.parse(snap.fetchedAt) <= Date.parse(S.fetchedAt)) return null;
  const prev = S;
  S = snap; NOW = new Date(); TODAY = keyOf(NOW);
  COURSES = C.courses.map(buildCourse);
  const y = window.scrollY;
  const ge = gEls(), gLeft = ge ? ge.sc.scrollLeft : null;
  app.classList.add('static');
  renderAll();
  go(current, { force: true, keepScroll: true, quiet: true });
  window.scrollTo(0, y);
  requestAnimationFrame(() => fitGantt(gLeft));
  if (!refreshing) renderSync();
  return diffSnaps(prev, snap);
}
function onRemoteSnapshot(snap, first) {
  const changes = applySnapshot(snap, false);
  if (changes && !first && !refreshing) toast('success', 'Canvas 数据已更新', changes.length ? changes : ['没有新成绩或 DDL 变化']);
}

/* ---------- 提示 ---------- */
const toastBox = el('div', { class: 'toasts', 'aria-live': 'polite' });
document.body.append(toastBox);
function toast(type, title, lines, ms) {
  const MAX = 6;
  const list = (lines || []).slice(0, MAX);
  if (lines && lines.length > MAX) list.push(`还有 ${lines.length - MAX} 项变化`);
  const t = el('div', { class: 'toast ' + type, role: type === 'error' ? 'alert' : 'status' },
    el('span', { class: 'ti', text: type === 'success' ? '✓' : type === 'info' ? 'i' : '!' }),
    el('div', null, el('div', { class: 'toast-t', text: title }),
      list.length === 1 ? el('div', { class: 'toast-d', text: list[0] }) : list.length ? el('ul', null, list.map(l => el('li', { text: l }))) : null));
  const bar = document.querySelector('.topbar');
  if (bar) toastBox.style.top = Math.round(bar.getBoundingClientRect().bottom + 12) + 'px';
  toastBox.append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, ms || (list.length > 1 ? 7000 : 4500));
}

/* ---------- 手动刷新 ---------- */
// 页面本身连不上 Canvas（平台不允许网页调用 Chrome 扩展）。按钮重新读取数据库里最新的一份：
// 定时任务每天 7:30 / 19:30 写入；想立刻更新，就在 Claude 桌面 App 里对定时任务点 Run now。
const refreshBtn = document.getElementById('refreshBtn');
function runNowHint() {
  const t = S.fetchedAt ? `${fmtMD.format(new Date(S.fetchedAt))} ${fmtHM.format(new Date(S.fetchedAt))}` : '—';
  return [`Canvas 数据同步于 ${t}（美东）。每天 7:30 和 19:30 自动更新。`,
    '想立刻从 Canvas 拉取：在 Claude 桌面 App 左侧 Scheduled（定时任务）里，给「Canvas 成绩看板刷新」点 Run now，1–2 分钟后本页会自己更新。'];
}
async function reloadFromDb() {
  await storeReady;
  if (!Store.snapRef) return { status: 'no_db' };
  let d = null;
  for (let i = 0; i < 2 && !d; i++) {
    try { d = await Store.snapRef.get(); }
    catch (e) {
      if (i === 0 && (!e || !e.code || e.code === 'unavailable')) { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); continue; }
      return { status: 'read_failed' };
    }
  }
  if (!d) return { status: 'read_failed' };
  if (!d.exists) return { status: 'empty' };
  let snap = null;
  try { snap = JSON.parse((d.data() || {}).json); } catch (e) {}
  return isValidSnap(snap) ? { status: 'ok', snap } : { status: 'bad' };
}
const changeLines = base => { const c = diffSnaps(base, S); return c.length ? c : ['没有新成绩或 DDL 变化']; };
async function onRefresh() {
  if (refreshing) return;
  // 本地双击打开（没有 claude.ai 运行时）：重新载入页面，读最新的 snapshot.js
  if (!window.claude) { progress('正在重新载入…'); location.reload(); return; }
  refreshing = true;
  const base = S; // 以点击那一刻为准，统计这次刷新期间的所有变化
  refreshBtn.disabled = true; refreshBtn.classList.add('busy');
  progress('正在载入最新数据…');
  try {
    const r = await reloadFromDb();
    if (r.status === 'ok') applySnapshot(r.snap, false);
    if (S !== base) toast('success', '已载入最新数据', changeLines(base));
    else if (r.status === 'ok' || r.status === 'empty') toast('info', '已经是最新数据', runNowHint(), 8000);
    else toast('warning', '读不到云端数据', [r.status === 'no_db' ? '这里连不上看板的数据库，页面显示的是上次发布时的数据。' : '数据库暂时没有响应，稍后再点一次刷新。']);
  } finally {
    refreshing = false;
    refreshBtn.disabled = false; refreshBtn.classList.remove('busy');
    renderSync();
  }
}
refreshBtn.addEventListener('click', onRefresh);

let start = 'overview';
try { start = localStorage.getItem('uf-dash-tab') || start; } catch (e) {}
const hash = (location.hash || '').slice(1).toUpperCase();
if (hash) start = hash === 'OVERVIEW' ? 'overview' : hash === 'OPS' ? 'ops' : hash;
go(start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInk);
const storeReady = Store.connect();
})();
